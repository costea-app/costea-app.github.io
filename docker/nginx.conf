server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # config.js nunca se cachea: contiene la configuración pública inyectada en el despliegue.
  location = /config.js { add_header Cache-Control "no-store"; try_files $uri =404; }

  # Rutas internas de la SPA: si el archivo no existe, se entrega index.html .
  location / { try_files $uri $uri/ /index.html; }
}
