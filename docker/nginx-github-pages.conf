# Imita el comportamiento de GitHub Pages para un repositorio llamado "costea":
# archivos estáticos bajo /costea/ y, si no existen, se responde 404.html (copia de index.html).
server {
  listen 80;
  root /usr/share/nginx/html;
  location = / { return 302 /costea/; }
  location /costea/ { try_files $uri $uri/ =404; }
  error_page 404 /costea/404.html;
}
