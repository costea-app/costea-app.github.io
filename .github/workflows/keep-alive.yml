name: Mantener Supabase activo

# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Este workflow hace una consulta a la base de datos cada 3 días para evitarlo.
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API REST
        env:
          # Configuración PÚBLICA (la misma que en deploy.yml). Nunca pongas aquí claves secretas.
          SUPABASE_URL: https://mspqsijvwbmnagehanrn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_89XQAjOoN9TCaUScSDNkqg_dI3MNw6r
        run: |
          # public.keep_alive() (migración 20261112000003) solo devuelve now(): la consulta
          # llega a Postgres y termina bien. Cualquier respuesta distinta de 200 hace fallar el job.
          status=$(curl -s -o /tmp/body -w '%{http_code}' -m 30 --retry 3 \
            -X POST -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d '{}' "$SUPABASE_URL/rest/v1/rpc/keep_alive" || true)
          echo "HTTP $status: $(head -c 300 /tmp/body 2>/dev/null)"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase no respondió 200 (HTTP $status). ¿Está pausado o falta la migración keep_alive?"
            exit 1
          fi
