# Uso:
#   docker compose up web                       -> app en modo desarrollo: http://localhost:4200
#   docker compose run --rm test                -> pruebas unitarias del motor y de los flujos (Vitest)
#   docker compose run --rm rls-test            -> migraciones + pruebas de RLS en Postgres 17
#   docker compose --profile prod up --build prod -> build de producción servido por nginx: http://localhost:8080
#   docker compose --profile ghpages up --build ghpages -> imita GitHub Pages: http://localhost:8090/costea/
#   docker compose run --rm tools npm install X -> cualquier comando npm, dentro del contenedor

x-node: &node
  build: { context: ., target: dev }
  image: costea-dev
  working_dir: /app
  environment:
    SUPABASE_URL: ${SUPABASE_URL:-}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  web:
    <<: *node
    command: sh -c "node scripts/write-config.mjs && npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    ports: ["4200:4200"]

  test:
    <<: *node
    profiles: [test]
    command: npx ng test --watch=false

  tools:
    <<: *node
    profiles: [tools]
    command: sh

  rls-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: postgres-solo-para-pruebas-locales
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]

  rls-test:
    image: postgres:17-alpine
    profiles: [test]
    depends_on: { rls-db: { condition: service_healthy } }
    environment:
      PGHOST: rls-db
      PGUSER: postgres
      PGPASSWORD: postgres-solo-para-pruebas-locales
    volumes: [./supabase:/supabase:ro]
    command: sh /supabase/tests/run.sh

  # ---- Integración: adaptador real de Supabase contra PostgREST + Postgres ----
  it-db:
    image: postgres:17-alpine
    profiles: [integration]
    environment:
      POSTGRES_PASSWORD: postgres-solo-para-pruebas-locales
    volumes:
      - ./supabase:/supabase:ro
      - ./supabase/tests/integration/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/costea-db-ready && pg_isready -U postgres"]
      interval: 2s
      retries: 30

  it-rest:
    image: postgrest/postgrest:v12.2.12
    profiles: [integration]
    depends_on: { it-db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator-solo-pruebas@it-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: secreto-local-de-pruebas-de-integracion-32+

  it-gateway:
    image: nginx:1.27-alpine
    profiles: [integration]
    depends_on: [it-rest]
    volumes: [./supabase/tests/integration/gateway.conf:/etc/nginx/conf.d/default.conf:ro]

  it-test:
    <<: *node
    profiles: [integration]
    depends_on: [it-gateway]
    environment:
      IT_SUPABASE_URL: http://it-gateway
      IT_JWT_SECRET: secreto-local-de-pruebas-de-integracion-32+
    command: sh -c "sleep 2 && npx vitest run --config vitest.integration.config.mts"

  prod:
    profiles: [prod]
    build:
      context: .
      target: prod
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports: ["8080:80"]

  ghpages:
    profiles: [ghpages]
    build:
      context: .
      target: ghpages
      args:
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        BASE_HREF: /costea/
    ports: ["8090:80"]

volumes:
  node_modules:
